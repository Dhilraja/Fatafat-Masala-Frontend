<div class="dialog-wrap">

  <!-- Header -->
  <div class="dialog-header">
    <div>
      <p class="section-label">{{ data ? 'Update Location' : 'New Location' }}</p>
      <h2 class="dialog-title">{{ data ? 'Edit Address' : 'Add Address' }}</h2>
    </div>
    <button class="close-btn" type="button" (click)="onClose()">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M2 2l12 12M14 2L2 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <!-- Form -->
  <form [formGroup]="cartForm" class="dialog-form">

    <div class="form-row two-cols">
      <div class="field-group">
        <label class="field-label">Full Name</label>
        <input class="field-input" placeholder="Recipient name" formControlName="name" autocomplete="name" />
      </div>
      <div class="field-group">
        <label class="field-label">Phone Number</label>
        <div class="phone-input-wrap">
          <span class="phone-prefix">+91</span>
          <input class="field-input phone-field" placeholder="10-digit mobile number" formControlName="phone" inputmode="numeric" maxlength="10" autocomplete="tel" />
        </div>
      </div>
    </div>

    <div class="form-row two-cols">
      <div class="field-group">
        <label class="field-label">Address Line 1</label>
        <input class="field-input" placeholder="House / Flat / Building no." formControlName="line1" />
      </div>
      <div class="field-group">
        <label class="field-label">Address Line 2</label>
        <input class="field-input" placeholder="Street / Area / Colony" formControlName="line2" />
      </div>
    </div>

    <div class="form-row three-cols">
      <div class="field-group">
        <label class="field-label">City</label>
        <input class="field-input" placeholder="City" formControlName="city" />
      </div>
      <div class="field-group">
        <label class="field-label">State</label>
        <select class="field-input field-select" formControlName="state">
          <option value="" disabled selected>Select state</option>
          <option value="Andaman and Nicobar Islands">Andaman and Nicobar Islands</option>
          <option value="Andhra Pradesh">Andhra Pradesh</option>
          <option value="Arunachal Pradesh">Arunachal Pradesh</option>
          <option value="Assam">Assam</option>
          <option value="Bihar">Bihar</option>
          <option value="Chandigarh">Chandigarh</option>
          <option value="Chhattisgarh">Chhattisgarh</option>
          <option value="Dadra and Nagar Haveli and Daman and Diu">Dadra and Nagar Haveli and Daman and Diu</option>
          <option value="Delhi">Delhi</option>
          <option value="Goa">Goa</option>
          <option value="Gujarat">Gujarat</option>
          <option value="Haryana">Haryana</option>
          <option value="Himachal Pradesh">Himachal Pradesh</option>
          <option value="Jammu and Kashmir">Jammu and Kashmir</option>
          <option value="Jharkhand">Jharkhand</option>
          <option value="Karnataka">Karnataka</option>
          <option value="Kerala">Kerala</option>
          <option value="Ladakh">Ladakh</option>
          <option value="Lakshadweep">Lakshadweep</option>
          <option value="Madhya Pradesh">Madhya Pradesh</option>
          <option value="Maharashtra">Maharashtra</option>
          <option value="Manipur">Manipur</option>
          <option value="Meghalaya">Meghalaya</option>
          <option value="Mizoram">Mizoram</option>
          <option value="Nagaland">Nagaland</option>
          <option value="Odisha">Odisha</option>
          <option value="Puducherry">Puducherry</option>
          <option value="Punjab">Punjab</option>
          <option value="Rajasthan">Rajasthan</option>
          <option value="Sikkim">Sikkim</option>
          <option value="Tamil Nadu">Tamil Nadu</option>
          <option value="Telangana">Telangana</option>
          <option value="Tripura">Tripura</option>
          <option value="Uttar Pradesh">Uttar Pradesh</option>
          <option value="Uttarakhand">Uttarakhand</option>
          <option value="West Bengal">West Bengal</option>
        </select>
      </div>
      <div class="field-group">
        <label class="field-label">Pin Code</label>
        <input class="field-input" placeholder="6-digit pincode" formControlName="pincode" maxlength="6" inputmode="numeric" />
      </div>
    </div>

    <!-- Actions -->
    <div class="dialog-actions">
      <button type="button" class="btn-outline" (click)="onClose()">Cancel</button>
      <button type="button" class="btn-primary" [disabled]="cartForm.invalid" (click)="onSave()">
        {{ data ? 'Save Changes' : 'Add Address' }}
      </button>
    </div>

  </form>
</div>
